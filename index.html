<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parti Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#101827;color:#eef3f8}.top{position:sticky;top:0;z-index:10;background:#17375e;padding:14px 18px;box-shadow:0 4px 18px #0008}.top h1{margin:0;font-size:22px}.tag{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:6px;background:#27ae60;font-size:12px}.sub{font-size:12px;opacity:.8;margin-top:4px}.bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px;background:#132033}.bar input{min-width:260px;flex:1;max-width:520px;border:1px solid #ffffff33;border-radius:999px;background:#0c1422;color:white;padding:10px 14px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#2f75b5;color:#fff}.tiles{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;padding:14px 18px;background:#0f1726}.tile{border:1px solid #ffffff22;background:#1d2b42;color:white;border-radius:8px;padding:12px;text-align:left;cursor:pointer;min-height:72px}.tile:hover{outline:2px solid #ffd54f}.tile b{display:block;color:#ffd54f;font-size:24px}.tile span{font-size:12px;opacity:.85}.layout{display:grid;grid-template-columns:280px 1fr;gap:14px;padding:14px 18px}.side{background:#17243a;border:1px solid #ffffff18;border-radius:8px;overflow:hidden}.side h2{font-size:15px;margin:0;padding:12px;background:#203452}.stage{width:100%;display:flex;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid #ffffff10;background:transparent;color:white;padding:10px 12px;cursor:pointer;text-align:left}.stage:hover,.stage.active{background:#2f75b566}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}.card{background:#17243a;border:1px solid #ffffff18;border-left:5px solid #4caf50;border-radius:8px;padding:12px;cursor:pointer}.card.warn{border-left-color:#ffc107}.card.crit{border-left-color:#ef4444}.card-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.parti{font-size:20px;font-weight:800;color:#ffd54f}.kg{font-weight:800}.muted{color:#aebbd0;font-size:12px}.badge{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;background:#ffffff14;color:#b9dcff;font-size:11px}.panel{position:fixed;right:16px;top:86px;width:min(820px,calc(100vw - 32px));max-height:82vh;overflow:auto;background:#111c2e;border:1px solid #ffffff2a;border-radius:10px;box-shadow:0 20px 70px #000b;z-index:50;display:none;padding:14px}.panel.show{display:block}.close{float:right;border:0;border-radius:50%;width:32px;height:32px;background:#ffffff18;color:white;font-size:18px;cursor:pointer}.list{display:grid;gap:8px;margin-top:10px}.row{background:#ffffff0d;border:1px solid #ffffff12;border-radius:8px;padding:10px}.row b{color:#ffd54f}.score{float:right;background:#2f75b5;border-radius:999px;padding:3px 8px;font-size:12px}.err{background:#4b1d1d;border-left:4px solid #ef4444}.empty{text-align:center;color:#aebbd0;padding:30px}.detail-grid{display:grid;grid-template-columns:130px 1fr;gap:6px;font-size:13px}.detail-grid div:nth-child(odd){color:#90caf9;font-weight:700}.panel-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.tool{border:1px solid #ffffff24;background:#1b2b44;color:white;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}.tool.active{background:#2f75b5;border-color:#ffd54f}.gantt{display:grid;gap:8px;margin-top:10px}.gantt-row{display:grid;grid-template-columns:160px 1fr 72px;gap:10px;align-items:center;background:#ffffff0d;border:1px solid #ffffff12;border-radius:8px;padding:9px}.gantt-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gantt-track{height:22px;background:#0b1220;border-radius:999px;overflow:hidden;border:1px solid #ffffff14}.gantt-bar{height:100%;min-width:4px;border-radius:999px;background:#4caf50}.gantt-bar.warn{background:#ffc107}.gantt-bar.crit{background:#ef4444}.gantt-meta{font-size:12px;color:#aebbd0;text-align:right}.gantt-scale{display:grid;grid-template-columns:160px 1fr 72px;gap:10px;color:#aebbd0;font-size:11px}.gantt-axis{display:flex;justify-content:space-between;padding:0 4px}@media(max-width:800px){.tiles{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{order:2}.panel{left:0;right:0;top:auto;bottom:0;width:100%;max-height:78vh;border-radius:14px 14px 0 0}.bar input{max-width:100%;width:100%}.gantt-row{grid-template-columns:1fr}.gantt-meta{text-align:left}.gantt-scale{display:none}}
</style>
</head>
<body>
<div class="top">
  <h1>Parti Takip Dashboard <span class="tag">GITHUB DATA</span></h1>
  <div class="sub" id="info">Veri yükleniyor...</div>
</div>
<div class="tiles">
  <button class="tile" data-panel="today"><b id="tToday">0</b><span>Bugün / Öncelik</span></button>
  <button class="tile" data-panel="bottleneck"><b id="tBottle">0</b><span>Darboğaz</span></button>
  <button class="tile" data-panel="control"><b id="tControl">0</b><span>Kontrol</span></button>
  <button class="tile" data-panel="repair"><b id="tRepair">0</b><span>Tamirli Parti</span></button>
  <button class="tile" data-panel="post"><b id="tPost">0</b><span>KK / Sarım Sonrası</span></button>
</div>
<div class="bar">
  <input id="search" placeholder="Parti, aşama, firma, kumaş ara">
  <button class="btn" data-filter="all">Tümü</button>
  <button class="btn" data-filter="crit">Kritik</button>
  <button class="btn" data-filter="warn">Uyarı</button>
  <button class="btn" id="reloadBtn">Veriyi Yenile</button>
</div>
<div class="layout">
  <aside class="side"><h2>Aşamalar</h2><div id="stages"></div></aside>
  <main><div id="cards" class="cards"></div></main>
</div>
<div id="panel" class="panel"></div>
<script>
let cards=[], repairs=[], currentStage='', currentFilter='all';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function norm(v){return String(v??'').trim().toLocaleLowerCase('tr-TR').replace(/\s+/g,' ')}
function num(v){const m=String(v??'').replace(',','.').match(/-?\d+(\.\d+)?/);return m?Number(m[0]):0}
function score(c){let s=0, parts=[]; if(c.sev==='crit'){s+=80;parts.push('kritik bekleme')} else if(c.sev==='warn'){s+=35;parts.push('uyarı bekleme')} if(c.due!==null&&c.due<0){s+=90;parts.push('termin geçti')} else if(c.due!==null&&c.due<=3){s+=45;parts.push('termin yakın')} if(num(c.pri)&&num(c.pri)<1000){s+=35;parts.push('öncelik no')} if((c.repairs||[]).length){s+=30*c.repairs.length;parts.push('tamir')} if(c.inner){s+=45;parts.push('iç tamir')} if(c.blocked){s+=35;parts.push('beklemede')} s+=Math.min(num(c.wait)*2,40); return {s,parts};}
function filtered(){const q=norm($('search').value);return cards.filter(c=>(!currentStage||c.stage===currentStage)&&(currentFilter==='all'||c.sev===currentFilter)&&(!q||norm([c.parti,c.stage,c.firma,c.fabric,c.recipe].join(' ')).includes(q)))}
function render(){const stageStats={};cards.forEach(c=>{stageStats[c.stage]=(stageStats[c.stage]||0)+1});$('stages').innerHTML='<button class="stage '+(!currentStage?'active':'')+'" data-stage="">TÜMÜ <b>'+cards.length+'</b></button>'+Object.entries(stageStats).sort((a,b)=>b[1]-a[1]).map(([s,n])=>'<button class="stage '+(currentStage===s?'active':'')+'" data-stage="'+esc(s)+'">'+esc(s)+' <b>'+n+'</b></button>').join('');const list=filtered();$('cards').innerHTML=list.length?list.map(c=>'<article class="card '+c.sev+'" data-card="'+c.id+'"><div class="card-head"><span class="parti">'+esc(c.parti)+'</span><span class="kg">'+Math.round(num(c.kg)).toLocaleString('tr-TR')+' kg</span></div><div class="muted">'+esc(c.firma||'-')+'</div><div>'+esc(c.fabric||'')+' '+esc(c.recipe||'')+'</div><span class="badge">'+esc(c.stage)+'</span> <span class="badge">'+(num(c.wait)||0).toFixed(1)+' gün</span> '+((c.repairs||[]).length?'<span class="badge">Tamir '+c.repairs.length+'</span>':'')+'</article>').join(''):'<div class="empty">Kayıt yok</div>';updateTiles()}
function updateTiles(){const today=cards.filter(c=>score(c).s>=90).length;const bottle=Object.values(cards.reduce((a,c)=>(a[c.stage]=(a[c.stage]||0)+1,a),{})).sort((a,b)=>b-a)[0]||0;const control=cards.filter(c=>!c.parti||!c.stage||num(c.kg)<=0||(c.due!==null&&c.due<0)||c.blocked).length;const repair=new Set(cards.filter(c=>(c.repairs||[]).length).map(c=>c.parti)).size;const post=postCards().length;$('tToday').textContent=today;$('tBottle').textContent=bottle;$('tControl').textContent=control;$('tRepair').textContent=repair;$('tPost').textContent=post}
function openPanel(title,body){$('panel').innerHTML='<button class="close" id="closePanel">×</button><h2>'+esc(title)+'</h2>'+body;$('panel').classList.add('show');$('closePanel').addEventListener('click',()=>$('panel').classList.remove('show'))}
function viewTools(kind,view){return '<div class="panel-tools"><button class="tool '+(view==='list'?'active':'')+'" data-panel-view="'+kind+'" data-view="list">Liste</button><button class="tool '+(view==='gantt'?'active':'')+'" data-panel-view="'+kind+'" data-view="gantt">Gantt Şeması</button></div>'}
function repairText(c){return (c.repairs||[]).map(r=>[r.tip,r.neden,r.not,r.stage,r.durum,r.tarih].filter(Boolean).join(' • ')).filter(Boolean).join(' | ')}
function rowsHtml(list, extra){return '<div class="list">'+(list.length?list.map((c,i)=>{const sc=score(c), rt=repairText(c);return '<div class="row" data-card="'+c.id+'"><span class="score">'+(extra?extra(c):sc.s+' puan')+'</span><b>'+(i+1)+'. '+esc(c.parti)+'</b><br>'+esc(c.stage)+' • '+Math.round(num(c.kg)).toLocaleString('tr-TR')+' kg • '+(num(c.wait)||0).toFixed(1)+' gün • Termin: '+esc(c.term||'-')+'<br><span class="muted">'+esc(c.firma||'')+' '+esc(sc.parts.join(' / '))+(rt?' • Tamir: '+esc(rt):'')+'</span></div>'}).join(''):'<div class="empty">Kayıt yok</div>')+'</div>'}
function ganttHtml(list){const max=Math.max(1,...list.map(c=>Math.max(num(c.wait),Math.abs(num(c.due)),1)));return '<div class="gantt-scale"><span></span><div class="gantt-axis"><span>0</span><span>'+Math.ceil(max/2)+'g</span><span>'+Math.ceil(max)+'g</span></div><span></span></div><div class="gantt">'+(list.length?list.map(c=>{const sc=score(c);const w=Math.max(6,Math.min(100,Math.round(Math.max(num(c.wait),Math.abs(num(c.due)),1)/max*100)));const meta=c.due===null?(num(c.wait)||0).toFixed(1)+'g':(c.due<0?Math.abs(c.due)+'g geçti':c.due+'g kaldı');return '<div class="gantt-row" data-card="'+c.id+'"><div class="gantt-label"><b>'+esc(c.parti)+'</b><br><span class="muted">'+esc(c.stage)+'</span></div><div class="gantt-track"><div class="gantt-bar '+(c.sev==='crit'||sc.s>=120?'crit':(c.sev==='warn'||sc.s>=90?'warn':''))+'" style="width:'+w+'%"></div></div><div class="gantt-meta">'+esc(meta)+'</div></div>'}).join(''):'<div class="empty">Kayıt yok</div>')+'</div>'}
function bottlenecks(){const m={};cards.forEach(c=>{const x=m[c.stage]||(m[c.stage]={stage:c.stage,count:0,kg:0,crit:0,repair:0});x.count++;x.kg+=num(c.kg);if(c.sev==='crit')x.crit++;if((c.repairs||[]).length)x.repair++});return Object.values(m).sort((a,b)=>(b.count+b.crit*2+b.repair)-(a.count+a.crit*2+a.repair))}
function bottleneckGanttHtml(){const bs=bottlenecks(), max=Math.max(1,...bs.map(b=>b.count+b.crit*2+b.repair));return '<div class="gantt-scale"><span></span><div class="gantt-axis"><span>az</span><span>orta</span><span>yüksek</span></div><span></span></div><div class="gantt">'+(bs.length?bs.map(b=>{const load=b.count+b.crit*2+b.repair;const w=Math.max(6,Math.round(load/max*100));return '<div class="gantt-row" data-stage="'+esc(b.stage)+'"><div class="gantt-label"><b>'+esc(b.stage)+'</b><br><span class="muted">'+b.count+' parti</span></div><div class="gantt-track"><div class="gantt-bar '+(b.crit?'crit':(b.repair?'warn':''))+'" style="width:'+w+'%"></div></div><div class="gantt-meta">'+Math.round(b.kg).toLocaleString('tr-TR')+' kg</div></div>'}).join(''):'<div class="empty">Veri yok</div>')+'</div>'}
function postCards(){return cards.filter(c=>{const f=norm(c.flow);const st=norm(c.stage);return f&&(f.includes('kalite kontrol')||f.includes('sarım 1')||f.includes('sarim 1'))&&!st.includes('kalite kontrol')&&!st.includes('sarım 1')&&!st.includes('sarim 1')}).sort((a,b)=>score(b).s-score(a).s)}
function panelList(kind){if(kind==='today')return cards.filter(c=>score(c).s>=90).sort((a,b)=>score(b).s-score(a).s);if(kind==='control')return cards.filter(c=>num(c.kg)<=0||(c.due!==null&&c.due<0)||c.blocked);if(kind==='repair')return cards.filter(c=>(c.repairs||[]).length);if(kind==='post')return postCards();return[]}
function showPanel(kind,view='list'){try{if(kind==='today')openPanel('Bugün / Öncelik',viewTools(kind,view)+(view==='gantt'?ganttHtml(panelList(kind)):rowsHtml(panelList(kind))));if(kind==='bottleneck')openPanel('Darboğaz',viewTools(kind,view)+(view==='gantt'?bottleneckGanttHtml():'<div class="list">'+(bottlenecks().map((b,i)=>'<div class="row" data-stage="'+esc(b.stage)+'"><b>'+(i+1)+'. '+esc(b.stage)+'</b><br>'+b.count+' parti • '+Math.round(b.kg).toLocaleString('tr-TR')+' kg • '+b.crit+' kritik • '+b.repair+' tamirli</div>').join('')||'<div class="empty">Veri yok</div>')+'</div>'));if(kind==='control')openPanel('Veri Kontrol',viewTools(kind,view)+(view==='gantt'?ganttHtml(panelList(kind)):rowsHtml(panelList(kind),c=>num(c.kg)<=0?'kg kontrol':(c.blocked?'beklemede':'termin'))));if(kind==='repair')openPanel('Tamirli Parti',rowsHtml(panelList(kind),c=>(c.repairs||[]).length+' tamir'));if(kind==='post')openPanel('KK / Sarım Sonrası',viewTools(kind,view)+(view==='gantt'?ganttHtml(panelList(kind)):rowsHtml(panelList(kind),c=>score(c).s+' puan')))}catch(e){openPanel('Hata','<div class="row err"><b>Panel açılamadı</b><br>'+esc(e.message||e)+'</div>')}}
function detail(id){const c=cards.find(x=>x.id===id);if(!c)return;openPanel('Parti Detay','<div class="detail-grid"><div>Parti</div><div>'+esc(c.parti)+'</div><div>Aşama</div><div>'+esc(c.stage)+'</div><div>Firma</div><div>'+esc(c.firma)+'</div><div>Kumaş</div><div>'+esc(c.fabric)+'</div><div>Reçete</div><div>'+esc(c.recipe)+'</div><div>Kilo</div><div>'+Math.round(num(c.kg)).toLocaleString('tr-TR')+'</div><div>Bekleme</div><div>'+(num(c.wait)||0).toFixed(1)+' gün</div><div>Termin</div><div>'+esc(c.term||'-')+'</div><div>Tamir</div><div>'+esc(repairText(c)||'-')+'</div></div>')}
async function loadData(){try{const ts=Date.now();const res=await fetch('data/partiler.json?ts='+ts,{cache:'no-store'});if(!res.ok)throw new Error('data/partiler.json bulunamadı: '+res.status);const data=await res.json();cards=data.cards||[];repairs=data.repairs||[];try{const tr=await fetch('data/tamirler.json?ts='+ts,{cache:'no-store'});if(tr.ok){const td=await tr.json();repairs=td.repairs||repairs;cards.forEach(c=>{c.repairs=repairs.filter(r=>String(r.parti).trim()===String(c.parti).trim())})}}catch(_e){}currentStage='';currentFilter='all';$('info').textContent='Güncel veri: '+(data.generatedAt?new Date(data.generatedAt).toLocaleString('tr-TR'):'')+' • '+cards.length+' parti • '+repairs.length+' tamir • '+Math.round(cards.reduce((s,c)=>s+num(c.kg),0)).toLocaleString('tr-TR')+' kg';render()}catch(e){$('info').textContent='Veri yüklenemedi: '+(e.message||e);openPanel('Veri Hatası','<div class="row err">'+esc(e.message||e)+'</div>')}}
function boot(){$('search').addEventListener('input',render);$('reloadBtn').addEventListener('click',loadData);document.body.addEventListener('click',e=>{const pv=e.target.closest('[data-panel-view]');if(pv){showPanel(pv.dataset.panelView,pv.dataset.view);return}const tile=e.target.closest('[data-panel]');if(tile){showPanel(tile.dataset.panel);return}const st=e.target.closest('[data-stage]');if(st){currentStage=st.dataset.stage;render();return}const fl=e.target.closest('[data-filter]');if(fl){currentFilter=fl.dataset.filter;render();return}const card=e.target.closest('[data-card]');if(card){detail(card.dataset.card);return}});loadData()}
document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
